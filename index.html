<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="نظام إدارة ديون كشك البنزين - إدارة عملاء الدين بسهولة">
<title>نظام إدارة ديون كشك البنزين</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</head>
<body>

<button class="logout-btn" onclick="logout()" title="تسجيل الخروج">🚪 تسجيل الخروج</button>

<header>
    <h1>💼 نظام إدارة ديون زبائن الكشك</h1>
</header>

<h2>📋 قائمة العملاء</h2>
<input type="text" id="search" placeholder="🔍 ابحث عن عميل بالاسم أو رقم الهاتف..." autocomplete="off">

<section class="stats">
    <div class="box">إجمالي العملاء: <span id="totalClients">0</span></div>
    <div class="box">إجمالي الديون: <span id="totalDebt">0 ₪</span></div>
    <div class="box">المتبقي: <span id="totalRemaining">0 ₪</span></div>
</section>

<section class="card" style="background: var(--bg-card); padding: 15px; margin: 15px auto; max-width: 600px;">
    <h2 style="font-size: 18px; margin-bottom: 15px;">💾 إدارة البيانات</h2>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
        <button onclick="exportData()" class="success" style="min-width: 150px;">📥 تصدير البيانات</button>
        <button onclick="importData()" style="min-width: 150px;">📤 استيراد البيانات</button>
        <button onclick="createBackup()" class="success" style="min-width: 150px;">💾 نسخ احتياطي</button>
        <button onclick="viewBackups()" style="min-width: 150px;">📋 عرض النسخ</button>
        <button onclick="printClientsReport()" style="min-width: 150px;">🖨️ طباعة كشف العملاء</button>
        <button onclick="clearAllData()" class="danger" style="min-width: 150px;">🗑️ حذف الكل</button>
        <button onclick="resetFirebaseDataConfirm()" class="danger" style="min-width: 150px;">🔄 إعادة تعيين Firebase</button>
    </div>
    <p style="text-align: center; color: var(--text-secondary); font-size: 13px; margin-top: 15px;">
        💡 نصيحة: قم بعمل نسخة احتياطية بانتظام لحماية بياناتك
    </p>
    <div id="saveStatus" style="text-align: center; margin-top: 10px; font-size: 12px; color: var(--text-secondary);">
        <span id="lastSaveTime">جاري التحميل...</span>
    </div>
    <div id="syncStatus" style="text-align: center; margin-top: 10px; font-size: 12px;">
        <span id="syncStatusText"></span>
    </div>
</section>

<section class="card">
    <h2>➕ إضافة عميل جديد</h2>
    <div id="errorMessage" class="error-message hidden"></div>
    <input id="name" type="text" placeholder="اسم العميل *" required autocomplete="off">
    <input id="phone" type="text" placeholder="رقم الهاتف (اختياري)" autocomplete="off" pattern="[0-9]*">
    <input id="amount" type="number" placeholder="المبلغ الأولي *" required min="0" step="0.01">
    <button id="addBtn">➕ إضافة العميل</button>
</section>

<div id="clientsList"></div>

<!-- Modal ملف العميل -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span class="close" onclick="closeModal()" aria-label="إغلاق">&times;</span>
        <h2 id="modalName"></h2>
        <div id="modalClientInfo"></div>
        <div id="modalHistory"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="exportPDF()" class="success">📄 تصدير كشف حساب PDF</button>
            <button onclick="closeModal()">إغلاق</button>
        </div>
    </div>
</div>

<!-- Modal التأكيد -->
<div id="confirmModal" class="modal hidden">
    <div class="modal-content confirm-modal-content">
        <div class="confirm-icon">⚠️</div>
        <h2 id="confirmTitle">تأكيد العملية</h2>
        <p id="confirmMessage"></p>
        <div class="confirm-buttons">
            <button id="confirmOk" class="confirm-btn confirm-ok">✅ نعم</button>
            <button id="confirmCancel" class="confirm-btn confirm-cancel">❌ إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal الإدخال -->
<div id="inputModal" class="modal hidden">
    <div class="modal-content input-modal-content">
        <span class="close" onclick="closeInputModal()" aria-label="إغلاق">&times;</span>
        <h2 id="inputTitle">إدخال البيانات</h2>
        <p id="inputLabel"></p>
        <input type="text" id="inputValue" placeholder="أدخل القيمة..." autocomplete="off">
        <div class="input-buttons">
            <button id="inputOk" class="confirm-btn confirm-ok">✅ تأكيد</button>
            <button id="inputCancel" class="confirm-btn confirm-cancel" onclick="closeInputModal()">❌ إلغاء</button>
        </div>
    </div>
</div>

<!-- Modal التنبيه -->
<div id="alertModal" class="modal hidden">
    <div class="modal-content alert-modal-content">
        <div class="alert-icon">ℹ️</div>
        <h2 id="alertTitle">تنبيه</h2>
        <p id="alertMessage"></p>
        <div class="alert-buttons">
            <button id="alertOk" class="confirm-btn confirm-ok">✅ موافق</button>
        </div>
    </div>
</div>

<!-- Modal النسخ الاحتياطية -->
<div id="backupsModal" class="modal hidden">
    <div class="modal-content" style="max-width: 700px;">
        <span class="close" onclick="closeBackupsModal()" aria-label="إغلاق">&times;</span>
        <h2>📋 النسخ الاحتياطية المتاحة</h2>
        <div id="backupsList" style="margin-top: 20px;"></div>
        <div style="margin-top: 20px; text-align: center;">
            <button onclick="closeBackupsModal()">إغلاق</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
